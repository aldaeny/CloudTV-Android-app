name: Build CloudTV 1.5 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CloudTV web app
        working-directory: artifacts/cloudtv
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          pnpm build

          echo "Checking build files..."

          if [ ! -f dist/public/index.html ]; then
            echo "ERROR: dist/public/index.html not found"
            find . -maxdepth 4 -name index.html
            exit 1
          fi

          echo "Web build successful"

      - name: Prepare Capacitor web assets
        working-directory: artifacts/cloudtv
        run: |
          mkdir -p dist

          cp -a dist/public/. dist/

          test -f dist/index.html

          echo "Capacitor web assets ready"

      - name: Create Android project
        working-directory: artifacts/cloudtv
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Sync Capacitor Android
        working-directory: artifacts/cloudtv
        run: |
          pnpm exec cap sync android

      - name: Configure Android version and permissions
        working-directory: artifacts/cloudtv/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle")

          if not gradle.exists():
              raise SystemExit("Android build.gradle not found")

          text = gradle.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 15',
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.5"',
              text
          )

          gradle.write_text(text)

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = manifest.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          if "usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(text)

          print("Android configuration updated")
          PY

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

      - name: Build Android Debug APK
        working-directory: artifacts/cloudtv/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f artifacts/cloudtv/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CloudTV APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudTV-1.5-Beta-APK
          path: artifacts/cloudtv/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
