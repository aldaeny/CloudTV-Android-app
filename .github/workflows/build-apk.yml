name: Build CloudTV 1.5 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CloudTV Web App
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/cloudtv build

      - name: Add & Sync Capacitor Android
        working-directory: artifacts/cloudtv
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android 1.5 & Cleartext HTTP IPTV
        working-directory: artifacts/cloudtv/android
        run: |
          sed -i 's/versionCode 1/versionCode 15/g' app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.5"/g' app/build.gradle
          if ! grep -q "usesCleartextTraffic" app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' app/src/main/AndroidManifest.xml
          fi

      - name: Build Debug APK
        working-directory: artifacts/cloudtv/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CloudTV 1.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudTV-1.5-APK
          path: artifacts/cloudtv/android/app/build/outputs/apk/debug/app-debug.apk
