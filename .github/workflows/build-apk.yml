name: Build CloudTV 1.5 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

            - name: Create and sync Android project
        working-directory: artifacts/cloudtv
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android
      - name: Create and sync Android project
        working-directory: artifacts/cloudtv
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Configure Android version and permissions
        working-directory: artifacts/cloudtv/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 15',
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.5"',
              text
          )

          gradle.write_text(text)

          manifest = Path(
              "app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          if "android.permission.INTERNET" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          if "usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          manifest.write_text(text)
          PY

      - name: Build Android Debug APK
        working-directory: artifacts/cloudtv/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload CloudTV APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloudTV-1.5-Beta-APK
          path: artifacts/cloudtv/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
