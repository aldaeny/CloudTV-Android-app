name: cloudtv

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: cloudtv
      POSTGRES_PASSWORD: cloudtv
      POSTGRES_DB: cloudtv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtv -d cloudtv"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot dependency install from the current lockfile, after the bind mount exists.
  install:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    command: ["sh", "-ec", "pnpm install --frozen-lockfile"]
    volumes:
      - .:/workspace

  # One-shot schema push (Drizzle) before the API starts.
  db-push:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    command: ["sh", "-ec", "pnpm --filter @workspace/db run push-force"]
    environment:
      DATABASE_URL: postgres://cloudtv:cloudtv@db:5432/cloudtv
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    volumes:
      - .:/workspace

  api:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    command: ["sh", "-ec", "exec pnpm --filter @workspace/api-server run dev"]
    restart: on-failure
    environment:
      PORT: "5000"
      NODE_ENV: development
      DATABASE_URL: postgres://cloudtv:cloudtv@db:5432/cloudtv
      BASE44_PREVIEW_MODE:
    ports:
      - "8000:5000"
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
      db-push:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      base44.project: "API Server"
      base44.kind: api
      base44.port: "8000"
      base44.docs: /api/healthz

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    command: ["sh", "-ec", "exec pnpm --filter @workspace/cloudtv run dev"]
    restart: on-failure
    environment:
      PORT: "3000"
      BASE_PATH: /
      NODE_ENV: development
      BASE44_PREVIEW_MODE:
    ports:
      - "3000:3000"
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      base44.project: "CloudTV"
      base44.kind: web
      base44.port: "3000"

  mockups:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /workspace
    command: ["sh", "-ec", "exec pnpm --filter @workspace/mockup-sandbox run dev"]
    restart: on-failure
    environment:
      PORT: "3001"
      BASE_PATH: /
      NODE_ENV: development
      BASE44_PREVIEW_MODE:
    ports:
      - "3001:3001"
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      base44.project: "Mockup Sandbox"
      base44.kind: web
      base44.port: "3001"

volumes:
  pgdata:
